services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./strategies:/app/strategies:ro
      - ./content:/app/content:ro
    ports:
      - "18091:8000"
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "18080:80"

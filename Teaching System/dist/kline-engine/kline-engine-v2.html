        drawHighlightRanges(ctx, rc) {
          if (!this.highlightRanges.length) return;
          const cutoff = this._cutoffForCurrent();
          const visible = rc.visible;
          const palette = this.theme === 'light'
            ? {
                olive: { fill: 'rgba(139, 154, 109, 0.22)', stroke: 'rgba(139, 154, 109, 0.72)', text: '#56623F' },
                red:   { fill: 'rgba(201, 137, 126, 0.22)', stroke: 'rgba(201, 137, 126, 0.72)', text: '#8A4038' },
                blue:  { fill: 'rgba(40, 95, 162, 0.20)',   stroke: 'rgba(40, 95, 162, 0.72)', text: '#285FA2' },
                marker:{ fill: 'rgba(154, 125, 72, 0.10)',   stroke: 'rgba(154, 125, 72, 0.76)', text: '#8A6A2B' },
              }
            : {
                olive: { fill: 'rgba(158, 176, 120, 0.28)', stroke: 'rgba(158, 176, 120, 0.82)', text: '#C6D6A0' },
                red:   { fill: 'rgba(220, 155, 145, 0.28)', stroke: 'rgba(220, 155, 145, 0.82)', text: '#F0B1A6' },
                blue:  { fill: 'rgba(120, 165, 220, 0.28)', stroke: 'rgba(120, 165, 220, 0.82)', text: '#9FC6F7' },
                marker:{ fill: 'rgba(214, 180, 103, 0.12)', stroke: 'rgba(214, 180, 103, 0.82)', text: '#E4C77D' },
              };

          ctx.save();
          this.highlightRanges.forEach((range) => {
            if (range.timeframe !== this.currentTimeframe) return;
            let start = range.startIndex;
            let end = range.endIndex;
            if (cutoff != null) {
              if (start > cutoff) return;
              end = Math.min(end, cutoff);
            }
            if (end < visible.start || start > visible.end) return;
            start = Math.max(start, visible.start);
            end = Math.min(end, visible.end);

            const xLeft = rc.xForIndex(start) - rc.slotWidth / 2;
            const xRight = rc.xForIndex(end) + rc.slotWidth / 2;
            const x = Math.max(rc.area.x, xLeft);
            const w = Math.max(1, Math.min(rc.chartRight, xRight) - x);

            const colors = palette[range.style] || palette.olive;
            if (range.style === 'marker' || range.style === 'olive') {
              // Restrained marker: a soft circular halo + solid dot anchored
              // near the top of the chart. No dashed leader line — the band
              // beneath the candle is implied, not drawn.
              // 'olive' ranges share the same restrained rendering: the wide
              // semi-transparent band was visually too heavy across multi-bar
              // ranges (e.g. setup_start..review_end), so we collapse it to a
              // single anchor dot regardless of range width.
              const markerX = clamp(x + w / 2, rc.area.x + 1, rc.chartRight - 1);
              const dotY = rc.area.y + 14;

              ctx.fillStyle = colors.fill;
              ctx.beginPath();
              ctx.arc(markerX, dotY, 9, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = colors.stroke;
              ctx.beginPath();
              ctx.arc(markerX, dotY, 3.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = this.theme === 'light' ? 'rgba(255,255,255,0.95)' : 'rgba(20,20,18,0.95)';
              ctx.lineWidth = 1.5;
              ctx.stroke();
              return;
            }

            ctx.fillStyle = colors.fill;
            ctx.fillRect(x, rc.area.y, w, rc.priceHeight);

            ctx.strokeStyle = colors.stroke;
            ctx.lineWidth = 1.25;
            ctx.beginPath();
            ctx.moveTo(x + 0.5, rc.area.y);
            ctx.lineTo(x + 0.5, rc.area.y + rc.priceHeight);
            ctx.moveTo(x + w - 0.5, rc.area.y);
            ctx.lineTo(x + w - 0.5, rc.area.y + rc.priceHeight);
            ctx.stroke();

            const dotX = clamp(x + w / 2, rc.area.x + 8, rc.chartRight - 8);
            ctx.fillStyle = colors.stroke;
            ctx.beginPath();
            ctx.arc(dotX, rc.area.y + 14, 3.5, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        getTimeframe() {
          return this.currentTimeframe;
        }

        getCurrentIndex() {
          return this.currentIndex;
        }

        // Returns the bar index currently under the cursor (after strict
        // chart-area hit-testing and cutoff clamping), or null when no bar is
        // hovered. Stays in sync with `hover:bar` event emission.
        getHoveredBarIndex() {
          return this._lastEmittedHoverIndex;
        }

        setTimeframe(timeframe) {
          this.pause();
          const result = this.dataManager.switchTimeframe(timeframe, this.currentIndex);
          this.currentTimeframe = result.timeframe;
          let nextIndex = result.index;
          // After switching, clamp currentIndex if the destination tf has a cutoff.
          const tfCutoff = this.revealCutoff[this.currentTimeframe];
          if (tfCutoff != null && nextIndex > tfCutoff) {
            nextIndex = tfCutoff;
          }
          this._updateToolbarState();
          // Re-center viewport on the time-aligned index so switching tf does
          // not visually jump to a default window. DataManager already mapped
          // the index by ts; without scrollTo the viewport would stay at its
          // previous viewStart and the same wall-clock moment would fall off
          // screen.
          this.scrollTo({ timeframe: this.currentTimeframe, barIndex: nextIndex, center: true });
          return result;
        }

        scheduleRender() {
          if (this._renderHandle) {
            return;
          }
          this._renderHandle = window.requestAnimationFrame(() => {
            this._renderHandle = 0;
            this.render();
          });
        }

        render() {
          const ctx = this.ctx;
          const width = this.canvas.width / (window.devicePixelRatio || 1);
          const height = this.canvas.height / (window.devicePixelRatio || 1);
          const tc = this._themeColors();

          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = tc.chartBg;
          ctx.fillRect(0, 0, width, height);

          ctx.strokeStyle = tc.grid;
          ctx.lineWidth = 1;
          for (let row = 1; row <= 4; row += 1) {
            const y = Math.round((height / 5) * row) + 0.5;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          const bars = this.dataManager.getBars(this.currentTimeframe);
          const meta = this.dataManager.getMeta();
          const visible = this.viewportManager.getVisibleWindow({
            totalBars: bars.length,
            currentIndex: this.currentIndex,
            timeframe: this.currentTimeframe,
            chartWidth: width,
          });

          if (!bars.length) {
            ctx.fillStyle = tc.emptyText;
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillText('Load data to initialize the engine.', 24, 42);
            this.metaEl.textContent = 'No data loaded';
            this.hudEl.innerHTML = '<strong>No bars</strong>';
            return;
          }

          // Clamp visible window against the active timeframe's reveal cutoff.
          // We only shrink `end` (not `count`) so slot widths stay stable — future
          // slots render empty, which matches how playback naturally reveals bars.
          const cutoff = this._cutoffForCurrent();
          if (cutoff != null) {
            if (visible.end > cutoff) visible.end = Math.max(visible.start, cutoff);
            if (visible.start > cutoff) visible.start = Math.max(0, cutoff);
          }

          const rc = this.buildRenderContext(bars, visible, width, height);
          this.lastRenderContext = rc;
          const hoveredIndex = this.hover.inside
            && this.hover.x >= rc.area.x
            && this.hover.x <= rc.chartRight
            && this.hover.y >= rc.area.y
            && this.hover.y <= rc.volumeY + rc.volumeHeight
            ? rc.barIndexForX(this.hover.x)
            : null;
          // HUD must not leak future data: clamp both currentIndex and hover
          // against the cutoff when deciding which bar drives the panel.
          const focusCandidate = hoveredIndex ?? this.currentIndex;
          const focusIndex = cutoff != null ? Math.min(focusCandidate, cutoff) : focusCandidate;
          const focusBar = bars[focusIndex] || bars[Math.min(bars.length - 1, cutoff ?? bars.length - 1)];

          // Emit hover:bar only on transitions. Clamp against cutoff so external
          // listeners (e.g. MA legend value display) can never read a future bar
          // even if the cursor lingers over a bar that is past the reveal cutoff.
          let hoverEmitIndex = hoveredIndex;
          if (hoverEmitIndex != null && cutoff != null) {
            hoverEmitIndex = hoverEmitIndex > cutoff ? null : hoverEmitIndex;
          }
          if (hoverEmitIndex !== this._lastEmittedHoverIndex || this.currentTimeframe !== this._lastEmittedHoverTf) {
            this._lastEmittedHoverIndex = hoverEmitIndex;
            this._lastEmittedHoverTf = this.currentTimeframe;
            this.emit('hover:bar', { index: hoverEmitIndex, timeframe: this.currentTimeframe });
          }

          this.drawGrid(ctx, rc);
          this.drawHighlightRanges(ctx, rc);
          this.drawVolumeBars(ctx, rc);
          this.drawCandles(ctx, rc);
          this.drawMALines(ctx, rc);
          this.drawAxes(ctx, rc);
          this.drawHighLowLabels(ctx, rc);
          this.drawAnnotationPins(ctx, rc);
          const crosshairState = this.drawCrosshair(ctx, rc, hoveredIndex);
          this.updatePanels(rc, focusBar, crosshairState);
          this._updateAnnoHover();
          this._updateHoverCard();
        }

        destroy() {
          if (this._destroyed) {
            return;
          }

          this._destroyed = true;

          // Stop playback
          if (this._playbackTimerId != null) {
            clearTimeout(this._playbackTimerId);
            this._playbackTimerId = null;
          }
          this._playing = false;
          if (this._newBarAnimHandle) {
            cancelAnimationFrame(this._newBarAnimHandle);
            this._newBarAnimHandle = 0;
          }
          this._newBarAnim = null;

          if (this._renderHandle) {
            window.cancelAnimationFrame(this._renderHandle);
            this._renderHandle = 0;
          }
          if (this.resizeObserver) {
            this.resizeObserver.disconnect();
          }
          if (this.boundKeydown) {
            document.removeEventListener('keydown', this.boundKeydown);
          }
          this.eventBus.destroy();
          this.container.innerHTML = '';
        }
      }

      window.KlineEngine = KlineEngine;

      function bootstrapDemo() {
        const container = document.getElementById('demo-engine');
        const engine = new KlineEngine({ container });
        window.demoKlineEngine = engine;
        window.__klineEngineV2Fixtures = DEMO_FIXTURES;

        // Annotations are injected by external consumers (backtest engine, daily-review, etc.)
        // via engine.loadData({ annotations_1m: [...] }). Engine itself has no synthetic data.

        try {
          const seedFixture = DEMO_FIXTURES.seed;
          const fullDayFixture = DEMO_FIXTURES.fullDay;
          if (!seedFixture || !fullDayFixture) {
            throw new Error('Embedded demo fixtures are missing.');
          }

          console.info('[kline-engine-v2] seed fixture ready', {
            bars_1m: seedFixture.bars_1m.length,
            bars_5m: seedFixture.bars_5m.length,
          });
          console.info('[kline-engine-v2] full-day fixture ready', {
            bars_1m: fullDayFixture.bars_1m.length,
            bars_5m: fullDayFixture.bars_5m.length,
          });

          engine.loadData(seedFixture);
          console.info('[kline-engine-v2] loadData(seed) ok', {
            timeframe: engine.getTimeframe(),
            index: engine.getCurrentIndex(),
          });

          // DevPanel — only in demo page, loaded via separate script
          if (window.KlineDevPanel) {
            window.demoDevPanel = new KlineDevPanel(engine);
            console.info('[kline-engine-v2] DevPanel attached');
          }
        } catch (error) {
          console.error('[kline-engine-v2] demo bootstrap failed', error);
          console.error(`Fixture load failed: ${error.message}`);
        }
      }

      bootstrapDemo();

      // ============================================================
      // Task 6: Integration verification — exercises all public APIs
      // Run via: window.runIntegrationTest()
      // ============================================================
      window.runIntegrationTest = function runIntegrationTest() {
        const eng = window.demoKlineEngine;
        const fixtures = window.__klineEngineV2Fixtures;
        const results = [];
        let passed = 0;
        let failed = 0;

        function assert(label, condition) {
          if (condition) {
            passed++;
            results.push({ label, status: 'PASS' });
          } else {
            failed++;
            results.push({ label, status: 'FAIL' });
            console.error(`[FAIL] ${label}`);
          }
        }

        // — loadData —
        const summary = eng.loadData(fixtures.seed);
        assert('loadData returns summary', summary && summary.counts && summary.counts.bars_1m === 67);
        assert('loadData sets timeframe to 1m', eng.getTimeframe() === '1m');
        assert('loadData sets initial index', eng.getCurrentIndex() === 30);

        // — data:loaded event —
        let dataLoadedFired = false;
        const offDataLoaded = eng.on('data:loaded', () => { dataLoadedFired = true; });
        eng.loadData(fixtures.fullDay);
        assert('data:loaded event fires', dataLoadedFired);
        offDataLoaded();

        // — setTimeframe —
        eng.setTimeframe('5m');
        assert('setTimeframe to 5m', eng.getTimeframe() === '5m');
        eng.setTimeframe('1m');
        assert('setTimeframe back to 1m', eng.getTimeframe() === '1m');

        // — viewport:changed event —
        let vpChangedFired = false;
        eng.on('viewport:changed', () => { vpChangedFired = true; });
        eng.scrollTo(100);
        assert('viewport:changed fires on scrollTo', vpChangedFired);

        // — scrollTo basic —
        eng.scrollTo(200);
        assert('scrollTo(200) sets currentIndex', eng.getCurrentIndex() === 200);

        // — scrollTo with object —
        eng.scrollTo({ barIndex: 150, center: true });
        assert('scrollTo({barIndex:150}) centers', eng.getCurrentIndex() === 150);

        // — scrollTo cross-timeframe —
        eng.scrollTo({ timeframe: '5m', barIndex: 30 });
        assert('scrollTo cross-tf switches to 5m', eng.getTimeframe() === '5m');
        assert('scrollTo cross-tf sets index', eng.getCurrentIndex() === 30);

        // — scrollTo highlight —
        eng.scrollTo({ timeframe: '1m', barIndex: 142, highlight: true });
        assert('scrollTo highlight activates', eng._scrollToHighlight != null);

        // — play / pause —
        eng.scrollTo(50);
        eng.play();
        assert('play() starts playback', eng.isPlaying() === true);
        eng.pause();
        assert('pause() stops playback', eng.isPlaying() === false);

        // — playback:state event —
        let statePayload = null;
        eng.on('playback:state', (p) => { statePayload = p; });
        eng.play();
        assert('playback:state fires on play', statePayload && statePayload.playing === true);
        eng.pause();
        assert('playback:state fires on pause', statePayload && statePayload.playing === false);

        // — setSpeed —
        eng.setSpeed(4);
        assert('setSpeed(4) sets speed', eng.getSpeed() === 4);
        eng.setSpeed(1);
        assert('setSpeed(1) resets', eng.getSpeed() === 1);

        // — stepForward / stepBack —
        const before = eng.getCurrentIndex();
        eng.stepForward();
        assert('stepForward advances index', eng.getCurrentIndex() === before + 1);
        eng.stepBack();
        assert('stepBack decrements index', eng.getCurrentIndex() === before);

        // — playback:tick event —
        let tickFired = false;
        eng.on('playback:tick', () => { tickFired = true; });
        eng.stepForward();
        assert('playback:tick fires on step', tickFired);
        eng.stepBack();

        // — annotation:click event —
        let annoClicked = null;
        eng.on('annotation:click', (a) => { annoClicked = a; });
        const testAnno = eng.dataManager.getAnnotations('1m')[0];
        if (testAnno) {
          eng.emit('annotation:click', testAnno);
          assert('annotation:click event works', annoClicked === testAnno);
        } else {
          assert('annotation:click skipped (no annos)', true);
        }

        // — bar:click event —
        let barClicked = null;
        eng.on('bar:click', (d) => { barClicked = d; });
        eng.emit('bar:click', { index: 42, bar: {} });
        assert('bar:click event works', barClicked && barClicked.index === 42);

        // — on / off —
        let tempFired = 0;
        const tempHandler = () => { tempFired++; };
        eng.on('test:event', tempHandler);
        eng.emit('test:event');
        eng.off('test:event', tempHandler);
        eng.emit('test:event');
        assert('on/off correctly binds and unbinds', tempFired === 1);

        // — on returns unsubscribe function —
        let unsub2Fired = 0;
        const unsub2 = eng.on('test:unsub', () => { unsub2Fired++; });
        eng.emit('test:unsub');
        unsub2();
        eng.emit('test:unsub');
        assert('on() returns working unsubscribe fn', unsub2Fired === 1);

        // — destroy —
        const testContainer = document.createElement('div');
        testContainer.style.cssText = 'width:600px;height:300px;position:absolute;left:-9999px';
        document.body.appendChild(testContainer);
        const testEng = new KlineEngine({ container: testContainer });
        testEng.loadData(fixtures.seed);
        testEng.play();
        testEng.destroy();
        assert('destroy stops playback', testEng._playing === false);
        assert('destroy clears timer', testEng._playbackTimerId === null);
        assert('destroy clears RAF', testEng._renderHandle === 0);
        assert('destroy clears DOM', testContainer.innerHTML === '');
        document.body.removeChild(testContainer);

        // — restore demo state —
        eng.loadData(fixtures.seed);
        // fixture name no longer tracked by engine

        // — Report —
        console.info(`[kline-engine-v2] Integration test: ${passed} passed, ${failed} failed out of ${passed + failed}`);
        results.forEach((r) => {
          console[r.status === 'PASS' ? 'log' : 'error'](`  [${r.status}] ${r.label}`);
        });

        return { passed, failed, total: passed + failed, results };
      };
    })();
  </script>

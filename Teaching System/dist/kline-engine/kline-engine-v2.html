      class EventBus {
        constructor() {
          this.listeners = new Map();
        }

        on(eventName, handler) {
          if (!this.listeners.has(eventName)) {
            this.listeners.set(eventName, new Set());
          }
          this.listeners.get(eventName).add(handler);
          return () => this.off(eventName, handler);
        }

        off(eventName, handler) {
          const bucket = this.listeners.get(eventName);
          if (!bucket) {
            return;
          }
          bucket.delete(handler);
          if (bucket.size === 0) {
            this.listeners.delete(eventName);
          }
        }

        emit(eventName, payload) {
          const bucket = this.listeners.get(eventName);
          if (!bucket) {
            return;
          }
          [...bucket].forEach((handler) => {
            handler(payload);
          });
        }

        destroy() {
          this.listeners.clear();
        }
      }

      class DataManager {
        constructor(eventBus) {
          this.eventBus = eventBus;
          this.timeframe = '1m';
          this.data = this._emptyData();
        }

        _emptyData() {
          return {
            meta: {},
            bars_1m: [],
            bars_5m: [],
            annotations_1m: [],
            annotations_5m: [],
          };
        }

        _normalizeBar(rawBar, meta) {
          const fallbackTs = rawBar.ts || (meta.date && rawBar.t ? `${meta.date}T${rawBar.t}:00` : null);
          return {
            ts: fallbackTs,
            t: rawBar.t || (fallbackTs ? fallbackTs.slice(11, 16) : ''),
            O: rawBar.O ?? null,
            H: rawBar.H ?? null,
            L: rawBar.L ?? null,
            C: rawBar.C ?? null,
            V: rawBar.V ?? 0,
            vw: rawBar.vw ?? null,
            hO: rawBar.hO ?? rawBar.O ?? null,
            hH: rawBar.hH ?? rawBar.H ?? null,
            hL: rawBar.hL ?? rawBar.L ?? null,
            hC: rawBar.hC ?? rawBar.C ?? null,
            m5:   rawBar.m5   ?? null,
            m10:  rawBar.m10  ?? null,
            m20:  rawBar.m20  ?? null,
            m30:  rawBar.m30  ?? null,
            m50:  rawBar.m50  ?? null,
            m60:  rawBar.m60  ?? null,
            m120: rawBar.m120 ?? null,
            m200: rawBar.m200 ?? null,
          };
        }

        _normalizeAnnotations(rawAnnotations, timeframe) {
          return (rawAnnotations || []).map((annotation) => ({
            bar_index: annotation.bar_index ?? 0,
            timeframe: annotation.timeframe || timeframe,
            title: annotation.title || '',
            body: annotation.body || '',
            type: annotation.type || 'info',
            style: annotation.style || 'blue',
            anchor_side: annotation.anchor_side || 'top',
            score: Object.prototype.hasOwnProperty.call(annotation, 'score') ? annotation.score : null,
          }));
        }

        loadData(payload) {
          const meta = { ...(payload.meta || {}) };
          const normalized = {
            meta,
            bars_1m: (payload.bars_1m || []).map((bar) => this._normalizeBar(bar, meta)),
            bars_5m: (payload.bars_5m || []).map((bar) => this._normalizeBar(bar, meta)),
            annotations_1m: this._normalizeAnnotations(payload.annotations_1m, '1m'),
            annotations_5m: this._normalizeAnnotations(payload.annotations_5m, '5m'),
          };

          this.data = normalized;
          this.timeframe = normalized.bars_1m.length ? '1m' : '5m';

          const summary = this.getSummary();
          this.eventBus.emit('data:loaded', summary);
          return summary;
        }

        getSummary() {
          return {
            meta: this.data.meta,
            timeframes: this.getAvailableTimeframes(),
            counts: {
              bars_1m: this.data.bars_1m.length,
              bars_5m: this.data.bars_5m.length,
              annotations_1m: this.data.annotations_1m.length,
              annotations_5m: this.data.annotations_5m.length,
            },
          };
        }

        getAvailableTimeframes() {
          return ['1m', '5m'].filter((timeframe) => this.getBars(timeframe).length > 0);
        }

        getTimeframe() {
          return this.timeframe;
        }

        getMeta() {
          return this.data.meta;
        }

        hasTimeframe(timeframe) {
          return this.getBars(timeframe).length > 0;
        }

        getBars(timeframe = this.timeframe) {
          return timeframe === '5m' ? this.data.bars_5m : this.data.bars_1m;
        }

        getAnnotations(timeframe = this.timeframe) {
          return timeframe === '5m' ? this.data.annotations_5m : this.data.annotations_1m;
        }

        getLastIndex(timeframe = this.timeframe) {
          return Math.max(0, this.getBars(timeframe).length - 1);
        }

        _timeValue(bar) {
          return bar?.ts || bar?.t || '';
        }

        findNearestIndexByTime(timeframe, targetValue) {
          const bars = this.getBars(timeframe);
          if (!bars.length) {
            return 0;
          }

          let nearestIndex = 0;
          for (let index = 0; index < bars.length; index += 1) {
            if (this._timeValue(bars[index]) <= targetValue) {
              nearestIndex = index;
            } else {
              break;
            }
          }
          return nearestIndex;
        }

        switchTimeframe(timeframe, currentIndex = this.getLastIndex()) {
          if (!this.hasTimeframe(timeframe)) {
            return {
              timeframe: this.timeframe,
              index: this.getLastIndex(),
            };
          }

          const currentBars = this.getBars(this.timeframe);
          const safeIndex = clamp(currentIndex, 0, Math.max(0, currentBars.length - 1));
          const currentBar = currentBars[safeIndex] || currentBars[currentBars.length - 1] || null;
          const nextIndex = currentBar
            ? this.findNearestIndexByTime(timeframe, this._timeValue(currentBar))
            : this.getLastIndex(timeframe);

          this.timeframe = timeframe;
          return { timeframe, index: nextIndex };
        }
      }

      class ViewportManager {
        constructor(eventBus) {
          this.eventBus = eventBus;
          this.zoomScale = 1;
          this.followMode = true;
          this.viewStart = 0;
          this.chartWidth = 0;
        }

        reset() {
          this.zoomScale = 1;
          this.followMode = true;
          this.viewStart = 0;
        }

        setChartWidth(width) {
          this.chartWidth = Math.max(1, width || 1);
        }

        getViewLimits(timeframe, totalBars) {
          const maxBars = timeframe === '5m' ? Math.min(78, totalBars || 78) : Math.min(390, totalBars || 390);
          const minBars = Math.min(10, maxBars || 10);
          return { minBars, maxBars: Math.max(1, maxBars) };
        }

        getWindowBarCount(width, timeframe) {
          const targetSlotWidth = timeframe === '5m' ? 18 : 14;
          const minBars = timeframe === '5m' ? 18 : 24;
          const maxBars = timeframe === '5m' ? 72 : 96;
          return clamp(Math.floor((width || 1) / targetSlotWidth), minBars, maxBars);
        }

        getResolvedViewCount(totalBars, timeframe, chartWidth = this.chartWidth) {
          const base = this.getWindowBarCount(chartWidth, timeframe);
          const limits = this.getViewLimits(timeframe, totalBars);
          const maxCount = Math.max(1, Math.min(limits.maxBars, totalBars || 1));
          const minCount = Math.min(limits.minBars, maxCount);
          const count = clamp(Math.round(base * this.zoomScale), minCount, maxCount);
          return { base, count, minCount, maxCount };
        }

        getVisibleWindow({ totalBars, currentIndex, timeframe, chartWidth = this.chartWidth }) {
          const view = this.getResolvedViewCount(totalBars, timeframe, chartWidth);
          // In follow mode, maxEnd is clipped to currentIndex (playback boundary).
          // In manual mode, allow viewing any part of the data.
          const maxEnd = this.followMode
            ? clamp(currentIndex, 0, Math.max(0, totalBars - 1))
            : Math.max(0, totalBars - 1);
          const maxStart = Math.max(0, maxEnd - view.count + 1);
          let start = this.followMode ? maxStart : clamp(this.viewStart, 0, maxStart);
          let end = Math.min(maxEnd, start + view.count - 1);

          if (end - start + 1 < view.count) {
            start = Math.max(0, end - view.count + 1);
          }

          if (start >= maxStart) {
            start = maxStart;
            this.followMode = true;
          }

          this.viewStart = start;
          return { ...view, start, end, maxStart };
        }

        applyZoom(nextCount, { anchorIndex, anchorRatio = 0.5, totalBars, currentIndex, timeframe, chartWidth = this.chartWidth }) {
          const view = this.getResolvedViewCount(totalBars, timeframe, chartWidth);
          const clampedCount = clamp(Math.round(nextCount), view.minCount, view.maxCount);
          if (clampedCount === view.count) {
            return this.getVisibleWindow({ totalBars, currentIndex, timeframe, chartWidth });
          }

          const maxStart = Math.max(0, currentIndex - clampedCount + 1);
          const safeAnchor = clamp(anchorIndex, 0, Math.max(0, currentIndex));
          let nextStart = Math.round(safeAnchor - anchorRatio * (clampedCount - 1));
          nextStart = clamp(nextStart, 0, maxStart);

          this.zoomScale = clampedCount / Math.max(1, view.base);
          this.viewStart = nextStart;
          this.setFollowMode(nextStart >= maxStart);

          return this.getVisibleWindow({ totalBars, currentIndex, timeframe, chartWidth });
        }

        setFollowMode(enabled) {
          this.followMode = Boolean(enabled);
          return this.followMode;
        }
      }

      class KlineEngine {
        constructor({ container }) {
          if (!container) {
            throw new Error('KlineEngine requires a container element.');
          }

          ensureEngineStyles();

          this.container = container;
          this.eventBus = new EventBus();
          this.dataManager = new DataManager(this.eventBus);
          this.viewportManager = new ViewportManager(this.eventBus);

          this.currentTimeframe = '1m';
          this.currentIndex = 0;
          this._renderHandle = 0;
          this._destroyed = false;
          this.hover = { x: -1, y: -1, inside: false };
          this.dragState = null;
          this.lastRenderContext = null;
          this.boundKeydown = null;
          // Track last emitted hover bar index so `hover:bar` only fires on
          // transitions (null → idx, idx → null, idx_a → idx_b), not every frame.
          this._lastEmittedHoverIndex = null;
          this._lastEmittedHoverTf = null;

          // Theme + MA visibility + candle type/fill (persisted per-session via localStorage)
          this.theme = 'dark';
          this.candleType = 'ha'; // 'ha' = Heikin-Ashi (Tang 策略默认) | 'normal' = 真实 OHLC
          this.candleFillMode = 'solid'; // 'solid' = filled bodies | 'hollow' = outline bodies
          this.maVisibility = { m5: true, m10: true, m20: true, m30: true, m50: true, m60: true, m120: true, m200: true, vw: true };
          try {
            const savedTheme = window.localStorage?.getItem('klineEngineV2:theme');
            if (savedTheme === 'light' || savedTheme === 'dark') this.theme = savedTheme;
            const savedCandle = window.localStorage?.getItem('klineEngineV2:candleType');
            if (savedCandle === 'ha' || savedCandle === 'normal') this.candleType = savedCandle;
            const savedCandleFill = window.localStorage?.getItem('klineEngineV2:candleFillMode');
            if (savedCandleFill === 'solid' || savedCandleFill === 'hollow') this.candleFillMode = savedCandleFill;
            const savedMA = window.localStorage?.getItem('klineEngineV2:maVisibility');
            if (savedMA) {
              const parsed = JSON.parse(savedMA);
              if (parsed && typeof parsed === 'object') {
                Object.keys(this.maVisibility).forEach((k) => {
                  if (typeof parsed[k] === 'boolean') this.maVisibility[k] = parsed[k];
                });
              }
            }
          } catch (_) { /* localStorage unavailable — use defaults */ }

          // Reveal cutoff: per-timeframe max absolute bar index that is allowed
          // to render/play. null = unbounded. Cleared on loadData(). Used by
          // teaching integrations to hide future bars during step-by-step training.
          this.revealCutoff = { '1m': null, '5m': null };

          // Highlight ranges: translucent band drawn behind candles to point the
          // reader at a specific span (e.g. validation panel -> "MA10 trigger"
          // highlights the decision bar). Each entry:
          //   { timeframe: '1m'|'5m', startIndex, endIndex, style? }
          // Cleared on loadData(). Only ranges matching currentTimeframe render.
          this.highlightRanges = [];

          // Playback state
          this._playing = false;
          this._playbackSpeed = 1;
          this._playbackTimerId = null;
          this._newBarAnim = null;  // { index, progress }
          this._newBarAnimHandle = 0;

          // Annotation state
          this._hoveredAnno = null;       // currently hovered annotation object
          this._annoHitZones = [];        // [{x, y, w, h, anno}] rebuilt each render
          this._scrollToHighlight = null; // {index, until} for flash animation
          this._wasDragging = false;

          this.on = this.eventBus.on.bind(this.eventBus);
          this.off = this.eventBus.off.bind(this.eventBus);
          this.emit = this.eventBus.emit.bind(this.eventBus);

          this._buildDOM();
          this._bindControls();
          this._bindCanvasHover();
          this._bindKeyboard();
          this._bindResize();
          this._updateToolbarState();
          this._updatePlaybackUI();
          this.scheduleRender();
        }

        _buildDOM() {
          this.container.innerHTML = '';

          this.root = document.createElement('section');
          this.root.className = 'kline-engine';
          this.root.setAttribute('data-theme', this.theme);

          this.toolbar = document.createElement('div');
          this.toolbar.className = 'kline-engine__toolbar';
          this.toolbar.innerHTML = `
            <div class="kline-engine__toolbar-group">
              <div>
                <div class="kline-engine__title">Kline Engine v2</div>
                <div class="kline-engine__meta" data-role="meta">Kline Engine v2</div>
              </div>
            </div>
            <div class="kline-engine__toolbar-group">
              <button class="kline-engine__button" data-action="timeframe" data-timeframe="1m">1m</button>
              <button class="kline-engine__button" data-action="timeframe" data-timeframe="5m">5m</button>
              <button class="kline-engine__button" data-action="step-back" title="Step Back">&#9664;&#9664;</button>
              <button class="kline-engine__button" data-action="play" title="Play">&#9654;</button>
              <button class="kline-engine__button" data-action="step-forward" title="Step Forward">&#9654;&#9654;</button>
              <button class="kline-engine__button" data-action="speed" data-speed="0.5">0.5x</button>
              <button class="kline-engine__button" data-action="speed" data-speed="1">1x</button>
              <button class="kline-engine__button" data-action="speed" data-speed="2">2x</button>
              <button class="kline-engine__button" data-action="speed" data-speed="4">4x</button>
              <button class="kline-engine__button" data-action="zoom-out">- Zoom</button>
              <button class="kline-engine__button" data-action="zoom-in">+ Zoom</button>
              <button class="kline-engine__button" data-action="follow">Follow</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m5"   title="Toggle MA5"><span class="kline-engine__swatch"></span>MA5</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m10"  title="Toggle MA10"><span class="kline-engine__swatch"></span>MA10</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m20"  title="Toggle MA20"><span class="kline-engine__swatch"></span>MA20</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m30"  title="Toggle MA30"><span class="kline-engine__swatch"></span>MA30</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m50"  title="Toggle MA50"><span class="kline-engine__swatch"></span>MA50</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m60"  title="Toggle MA60"><span class="kline-engine__swatch"></span>MA60</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m120" title="Toggle MA120"><span class="kline-engine__swatch"></span>MA120</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="m200" title="Toggle MA200"><span class="kline-engine__swatch"></span>MA200</button>
              <button class="kline-engine__button kline-engine__ma-button" data-action="toggle-ma" data-ma="vw"   title="Toggle VWAP"><span class="kline-engine__swatch"></span>VWAP</button>
              <button class="kline-engine__button" data-action="candle-type" title="Toggle Heikin-Ashi / normal candles">HA</button>
              <button class="kline-engine__button" data-action="candle-fill" title="Toggle filled / hollow candles">Solid</button>
              <button class="kline-engine__button" data-action="theme" title="Toggle black/white theme">&#9788; Light</button>
            </div>
          `;

          this.viewportEl = document.createElement('div');
          this.viewportEl.className = 'kline-engine__viewport';

          this.canvasWrap = document.createElement('div');
          this.canvasWrap.className = 'kline-engine__canvas-wrap';

          this.canvas = document.createElement('canvas');
          this.canvas.className = 'kline-engine__canvas';
          this.ctx = this.canvas.getContext('2d');

          this.overlay = document.createElement('div');
          this.overlay.className = 'kline-engine__overlay';
          this.overlay.innerHTML = `
            <div class="kline-engine__hud" data-role="hud"></div>
          `;

          this.annoTooltip = document.createElement('div');
          this.annoTooltip.className = 'kline-engine__anno-tooltip';
          this.annoTooltip.innerHTML = `
            <div class="kline-engine__anno-tooltip-title" data-role="anno-title"></div>
            <div class="kline-engine__anno-tooltip-body" data-role="anno-body"></div>
            <span class="kline-engine__anno-tooltip-score" data-role="anno-score"></span>
          `;

          // Per-bar OHLCV hover card (shown when cursor is over a candle and
          // there is no annotation hit). Pure DOM tooltip — content is rebuilt
          // on each show, positioned in viewport coords with edge clamping.
          this.hoverCard = document.createElement('div');
          this.hoverCard.className = 'kline-engine__hover-card';
          this.hoverCard.innerHTML = `
            <div class="kline-engine__hover-card-time" data-role="hc-time"></div>
            <div data-role="hc-rows"></div>
          `;

          this.canvasWrap.appendChild(this.canvas);
          this.viewportEl.appendChild(this.canvasWrap);
          this.viewportEl.appendChild(this.overlay);
          this.viewportEl.appendChild(this.annoTooltip);
          this.viewportEl.appendChild(this.hoverCard);
          this.root.appendChild(this.toolbar);
          this.root.appendChild(this.viewportEl);
          this.container.appendChild(this.root);

          this.metaEl = this.root.querySelector('[data-role="meta"]');
          this.hudEl = this.root.querySelector('[data-role="hud"]');
        }

        _bindControls() {
          this.toolbar.addEventListener('click', async (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) {
              return;
            }

            const action = button.dataset.action;
            if (action === 'timeframe') {
              this.setTimeframe(button.dataset.timeframe);
              return;
            }

            if (action === 'zoom-in' || action === 'zoom-out') {
              const bars = this.dataManager.getBars(this.currentTimeframe);
              if (!bars.length) {
                return;
              }
              const visible = this.viewportManager.getVisibleWindow({
                totalBars: bars.length,
                currentIndex: this.currentIndex,
                timeframe: this.currentTimeframe,
                chartWidth: this._getChartWidth(),
              });
              const nextCount = action === 'zoom-in'
                ? Math.max(visible.minCount, Math.round(visible.count / 1.12))
                : Math.min(visible.maxCount, Math.round(visible.count * 1.12));
              this.viewportManager.applyZoom(nextCount, {
                anchorIndex: this.currentIndex,
                anchorRatio: 0.5,
                totalBars: bars.length,
                currentIndex: this.currentIndex,
                timeframe: this.currentTimeframe,
                chartWidth: this._getChartWidth(),
              });
              this.emit('viewport:changed', this._getViewportPayload());
              this.scheduleRender();
              return;
            }

            if (action === 'play') {
              this.togglePlayback();
              return;
            }

            if (action === 'step-forward') {
              this.stepForward();
              return;
            }

            if (action === 'step-back') {
              this.stepBack();
              return;
            }

            if (action === 'speed') {
              this.setSpeed(parseFloat(button.dataset.speed));
              return;
            }

            if (action === 'follow') {
              this.viewportManager.setFollowMode(!this.viewportManager.followMode);
              this.emit('viewport:changed', this._getViewportPayload());
              this.scheduleRender();
              return;
            }

            if (action === 'toggle-ma') {
              const key = button.dataset.ma;
              if (key && key in this.maVisibility) {
                this.maVisibility[key] = !this.maVisibility[key];
                try { window.localStorage?.setItem('klineEngineV2:maVisibility', JSON.stringify(this.maVisibility)); } catch (_) {}
                this._updateToolbarState();
                this.emit('ma:visibility', { ...this.maVisibility });
                this.scheduleRender();
              }
              return;
            }

            if (action === 'theme') {
              this.setTheme(this.theme === 'dark' ? 'light' : 'dark');
              return;
            }

            if (action === 'candle-type') {
              this.setCandleType(this.candleType === 'ha' ? 'normal' : 'ha');
              return;
            }

            if (action === 'candle-fill') {
              this.setCandleFillMode(this.candleFillMode === 'solid' ? 'hollow' : 'solid');
              return;
            }

            // (fixture switching removed — now handled by DevPanel or external caller)
          });
        }

        setTheme(theme) {
          const next = theme === 'light' ? 'light' : 'dark';
          if (next === this.theme) return;
          this.theme = next;
          if (this.root) this.root.setAttribute('data-theme', next);
          try { window.localStorage?.setItem('klineEngineV2:theme', next); } catch (_) {}
          this._updateToolbarState();
          this.emit('theme:changed', { theme: next });
          this.scheduleRender();
        }

        getTheme() {
          return this.theme;
        }

        setCandleType(type) {
          const next = type === 'normal' ? 'normal' : 'ha';
          if (next === this.candleType) return;
          this.candleType = next;
          try { window.localStorage?.setItem('klineEngineV2:candleType', next); } catch (_) {}
          this._updateToolbarState();
          this.emit('candletype:changed', { candleType: next });
          this.scheduleRender();
        }

        getCandleType() {
          return this.candleType;
        }

        setCandleFillMode(mode) {
          const next = mode === 'hollow' ? 'hollow' : 'solid';
          if (next === this.candleFillMode) return;
          this.candleFillMode = next;
          try { window.localStorage?.setItem('klineEngineV2:candleFillMode', next); } catch (_) {}
          this._updateToolbarState();
          this.emit('candlefill:changed', { candleFillMode: next });
          this.scheduleRender();
        }

        getCandleFillMode() {
          return this.candleFillMode;
        }

        _bindCanvasHover() {
          const updateHover = (event) => {
            const rect = this.canvas.getBoundingClientRect();
            this.hover.x = event.clientX - rect.left;
            this.hover.y = event.clientY - rect.top;
            this.hover.inside = true;
            this.scheduleRender();
          };

          this.canvas.addEventListener('mousemove', updateHover);
          this.canvas.addEventListener('pointermove', (event) => {
            updateHover(event);
            if (!this.dragState || event.pointerId !== this.dragState.pointerId) {
              return;
            }
            const dx = this.dragState.startX - this.hover.x;
            const offsetBars = Math.round(dx / Math.max(1, this.dragState.slotWidth));
            const maxStart = Math.max(0, this.currentIndex - this.dragState.viewCount + 1);
            this.viewportManager.viewStart = clamp(this.dragState.startViewStart + offsetBars, 0, maxStart);
            this.viewportManager.setFollowMode(this.viewportManager.viewStart >= maxStart);
            this.emit('viewport:changed', this._getViewportPayload());
            this.scheduleRender();
          });
          this.canvas.addEventListener('wheel', (event) => {
            event.preventDefault();
            const bars = this.dataManager.getBars(this.currentTimeframe);
            if (!bars.length || !this.lastRenderContext) {
              return;
            }
            const factor = event.deltaY > 0 ? 1.12 : 1 / 1.12;
            const anchorIndex = this.lastRenderContext.barIndexForX(this.hover.x);
            const anchorRatio = (anchorIndex - this.lastRenderContext.visible.start) / Math.max(1, this.lastRenderContext.visible.count - 1);
            const nextCount = Math.round(this.lastRenderContext.visible.count * factor);
            this.viewportManager.applyZoom(nextCount, {
              anchorIndex,
              anchorRatio,
              totalBars: bars.length,
              currentIndex: this.currentIndex,
              timeframe: this.currentTimeframe,
              chartWidth: this._getChartWidth(),
            });
            this.emit('viewport:changed', this._getViewportPayload());
            this.scheduleRender();
          }, { passive: false });
          this.canvas.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || !this.lastRenderContext) {
              return;
            }
            this.canvas.setPointerCapture(event.pointerId);
            this.dragState = {
              pointerId: event.pointerId,
              startX: this.hover.x,
              startViewStart: this.viewportManager.viewStart,
              slotWidth: this.lastRenderContext.slotWidth,
              viewCount: this.lastRenderContext.visible.count,
            };
          });
          this.canvas.addEventListener('pointerup', (event) => {
            if (this.dragState && event.pointerId === this.dragState.pointerId) {
              const dx = Math.abs(this.hover.x - this.dragState.startX);
              this._wasDragging = dx > 3;
              this.dragState = null;
              this.canvas.releasePointerCapture(event.pointerId);
            }
          });
          this.canvas.addEventListener('lostpointercapture', () => {
            this.dragState = null;
          });
          this.canvas.addEventListener('click', (event) => {
            if (this._wasDragging) { this._wasDragging = false; return; }
            const rect = this.canvas.getBoundingClientRect();
            const mx = event.clientX - rect.left;
            const my = event.clientY - rect.top;
            const hit = this._hitTestAnnotation(mx, my);
            if (hit) {
              this.emit('annotation:click', hit.anno);
            } else if (this.lastRenderContext) {
              const barIdx = this.lastRenderContext.barIndexForX(mx);
              this.emit('bar:click', { index: barIdx, bar: this.lastRenderContext.bars[barIdx] });
            }
          });
          this.canvas.addEventListener('mouseleave', () => {
            this.hover = { x: -1, y: -1, inside: false };
            this._hideAnnoTooltip();
            this._hideHoverCard();
            this.scheduleRender();
          });
        }

        _bindKeyboard() {
          this.boundKeydown = (event) => {
            if (event.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName)) {
              return;
            }
            if (event.key === 'ArrowRight') {
              event.preventDefault();
              if (this._playing) return;
              this.stepForward();
              return;
            }
            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              if (this._playing) return;
              this.stepBack();
              return;
            }
            if (event.key === '1') {
              this.setTimeframe('1m');
              return;
            }
            if (event.key === '5') {
              this.setTimeframe('5m');
              return;
            }
            if (event.key === ' ') {
              event.preventDefault();
              this.togglePlayback();
            }
          };
          document.addEventListener('keydown', this.boundKeydown);
        }

        _bindResize() {
          this.resizeObserver = new ResizeObserver(() => {
            this._resizeCanvas();
          });
          this.resizeObserver.observe(this.container);
          this._resizeCanvas();
        }

        _getChartWidth() {
          return Math.max(1, this.canvasWrap.clientWidth);
        }

        _getChartHeight() {
          const explicitHeight = this.canvasWrap.clientHeight;
          return Math.max(320, explicitHeight || DEFAULT_HEIGHT);
        }

        _resizeCanvas() {
          const cssWidth = this._getChartWidth();
          const cssHeight = this._getChartHeight();
          const dpr = window.devicePixelRatio || 1;

          this.canvas.width = Math.round(cssWidth * dpr);
          this.canvas.height = Math.round(cssHeight * dpr);
          this.canvas.style.width = `${cssWidth}px`;
          this.canvas.style.height = `${cssHeight}px`;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          this.viewportManager.setChartWidth(cssWidth);
          this.emit('viewport:changed', this._getViewportPayload());
          this.scheduleRender();
        }

        _resolveInitialIndex(timeframe) {
          const bars = this.dataManager.getBars(timeframe);
          if (!bars.length) {
            return 0;
          }
          const meta = this.dataManager.getMeta();
          const key = timeframe === '5m' ? 'initial_index_5m' : 'initial_index_1m';
          if (Number.isInteger(meta[key])) {
            return clamp(meta[key], 0, bars.length - 1);
          }
          return bars.length - 1;
        }

        _updateToolbarState() {
          this.root.querySelectorAll('button[data-timeframe]').forEach((button) => {
            button.classList.toggle('is-active', button.dataset.timeframe === this.currentTimeframe);
            button.disabled = !this.dataManager.hasTimeframe(button.dataset.timeframe);
          });

          this.root.querySelectorAll('button[data-action="toggle-ma"]').forEach((button) => {
            const key = button.dataset.ma;
            const on = !!this.maVisibility[key];
            button.classList.toggle('is-off', !on);
            button.setAttribute('aria-pressed', on ? 'true' : 'false');
          });

          const themeBtn = this.root.querySelector('button[data-action="theme"]');
          if (themeBtn) {
            themeBtn.innerHTML = this.theme === 'dark' ? '&#9788; Light' : '&#9790; Dark';
            themeBtn.title = this.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
          }

          const candleBtn = this.root.querySelector('button[data-action="candle-type"]');
          if (candleBtn) {
            candleBtn.textContent = this.candleType === 'ha' ? 'HA' : 'OHLC';
            candleBtn.title = this.candleType === 'ha'
              ? 'Currently Heikin-Ashi — click to switch to real OHLC candles'
              : 'Currently real OHLC — click to switch to Heikin-Ashi';
            candleBtn.classList.toggle('is-active', this.candleType === 'normal');
          }

          const candleFillBtn = this.root.querySelector('button[data-action="candle-fill"]');
          if (candleFillBtn) {
            const isSolid = this.candleFillMode === 'solid';
            candleFillBtn.textContent = isSolid ? 'Solid' : 'Hollow';
            candleFillBtn.title = isSolid
              ? 'Currently filled candles — click to switch to hollow bodies'
              : 'Currently hollow candles — click to switch to filled bodies';
            candleFillBtn.classList.toggle('is-active', isSolid);
          }
        }

        _getViewportPayload() {
          const bars = this.dataManager.getBars(this.currentTimeframe);
          return this.viewportManager.getVisibleWindow({
            totalBars: bars.length,
            currentIndex: this.currentIndex,
            timeframe: this.currentTimeframe,
            chartWidth: this._getChartWidth(),
          });
        }

        _resolveOHLC(bar) {
          // Pick OHLC source according to the user-selected candle type.
          // HA 模式：hO/hH/hL/hC 缺失时回退到真实 OHLC（保护数据不全的 fixture）。
          // Normal 模式：直接用真实 O/H/L/C。
          if (this.candleType === 'normal') {
            return {
              open:  bar.O ?? bar.C ?? 0,
              high:  bar.H ?? bar.C ?? 0,
              low:   bar.L ?? bar.C ?? 0,
              close: bar.C ?? bar.O ?? 0,
            };
          }
          return {
            open:  bar.hO ?? bar.O ?? bar.C ?? 0,
            high:  bar.hH ?? bar.H ?? 0,
            low:   bar.hL ?? bar.L ?? 0,
            close: bar.hC ?? bar.C ?? bar.O ?? 0,
          };
        }

        _themeColors() {
          const isLight = this.theme === 'light';
          return {
            chartBg: isLight ? '#FFFFFF' : '#1e1e1e',
            grid: isLight ? 'rgba(26, 26, 25, 0.08)' : 'rgba(255, 255, 255, 0.06)',
            axisText: isLight ? 'rgba(26, 26, 25, 0.62)' : 'rgba(255, 255, 255, 0.56)',
            axisTextStrong: isLight ? 'rgba(26, 26, 25, 0.85)' : 'rgba(255, 255, 255, 0.82)',
            hlLine: isLight ? 'rgba(26, 26, 25, 0.55)' : 'rgba(255, 255, 255, 0.72)',
            hlText: isLight ? 'rgba(26, 26, 25, 0.85)' : 'rgba(255, 255, 255, 0.82)',
            crosshair: isLight ? 'rgba(26, 26, 25, 0.38)' : 'rgba(255, 255, 255, 0.3)',
            crosshairLabelBg: isLight ? 'rgba(26, 26, 25, 0.88)' : 'rgba(40, 40, 40, 0.92)',
            crosshairLabelText: isLight ? '#FFFFFF' : '#ffffff',
            emptyText: isLight ? 'rgba(26, 26, 25, 0.55)' : 'rgba(255, 255, 255, 0.45)',
          };
        }

        chartArea(width, height) {
          const rightGutter = width < 560 ? 124 : 148;
          return {
            x: 18,
            y: 18,
            w: Math.max(120, width - rightGutter),
            h: Math.max(160, height - 54),
            axisRight: width - rightGutter + 20,
            axisBottom: height - 22,
          };
        }

        buildRenderContext(bars, visible, width, height) {
          const area = this.chartArea(width, height);
          const priceHeight = area.h * 0.78;
          const volumeHeight = area.h * 0.18;
          const volumeY = area.y + priceHeight + 12;
          const visibleBars = bars.slice(visible.start, visible.end + 1);
          const scanBars = visibleBars;

          let priceMin = Number.POSITIVE_INFINITY;
          let priceMax = Number.NEGATIVE_INFINITY;
          let volumeMax = 1;

          scanBars.forEach((bar) => {
            // Y-axis range based on candle H/L only — MA lines may extend beyond chart edges.
            // This matches moomoo behavior: zoom in → candles fill the chart height.
            const { high, low } = this._resolveOHLC(bar);
            if (high != null) priceMax = Math.max(priceMax, high);
            if (low != null) priceMin = Math.min(priceMin, low);
            volumeMax = Math.max(volumeMax, bar.V || 0);
          });

          if (!Number.isFinite(priceMin) || !Number.isFinite(priceMax)) {
            priceMin = 0;
            priceMax = 1;
          }

          const pricePadding = Math.max((priceMax - priceMin) * 0.02, 0.01);
          priceMin -= pricePadding;
          priceMax += pricePadding;

          const slotWidth = area.w / Math.max(1, visible.count);
          const bodyWidth = Math.max(2, slotWidth * 0.65);
          const baseline = visibleBars[0]?.C || bars[0]?.C || 1;
          const chartRight = area.x + area.w;

          const xForIndex = (absoluteIndex) => area.x + (absoluteIndex - visible.start + 0.5) * slotWidth;
          const yForPrice = (price) => area.y + priceHeight * (1 - (price - priceMin) / Math.max(0.0001, priceMax - priceMin));
          const yForVolume = (volume) => volumeY + volumeHeight * (1 - volume / Math.max(1, volumeMax));
          const priceForY = (y) => priceMax - ((y - area.y) / Math.max(1, priceHeight)) * (priceMax - priceMin);
          const barIndexForX = (x) => clamp(visible.start + Math.floor((x - area.x) / Math.max(1, slotWidth)), visible.start, visible.end);

          return {
            bars,
            visible,
            visibleBars,
            width,
            height,
            area,
            priceHeight,
            volumeHeight,
            volumeY,
            priceMin,
            priceMax,
            volumeMax,
            slotWidth,
            bodyWidth,
            baseline,
            chartRight,
            xForIndex,
            yForPrice,
            yForVolume,
            priceForY,
            barIndexForX,
          };
        }

        drawGrid(ctx, rc) {
          ctx.save();
          ctx.strokeStyle = this._themeColors().grid;
          ctx.lineWidth = 1;

          for (let index = 0; index <= 5; index += 1) {
            const y = Math.round(rc.area.y + (rc.priceHeight / 5) * index) + 0.5;
            ctx.beginPath();
            ctx.moveTo(rc.area.x, y);
            ctx.lineTo(rc.chartRight, y);
            ctx.stroke();
          }

          for (let index = 0; index <= 2; index += 1) {
            const y = Math.round(rc.volumeY + (rc.volumeHeight / 2) * index) + 0.5;
            ctx.beginPath();
            ctx.moveTo(rc.area.x, y);
            ctx.lineTo(rc.chartRight, y);
            ctx.stroke();
          }

          const tickStep = Math.max(1, Math.round(rc.visible.count / 6));
          for (let absoluteIndex = rc.visible.start; absoluteIndex <= rc.visible.end; absoluteIndex += tickStep) {
            const x = Math.round(rc.xForIndex(absoluteIndex)) + 0.5;
            ctx.beginPath();
            ctx.moveTo(x, rc.area.y);
            ctx.lineTo(x, rc.volumeY + rc.volumeHeight);
            ctx.stroke();
          }
          ctx.restore();
        }

        drawVolumeBars(ctx, rc) {
          ctx.save();
          rc.visibleBars.forEach((bar, localIndex) => {
            const absoluteIndex = rc.visible.start + localIndex;
            const x = rc.xForIndex(absoluteIndex) - rc.bodyWidth / 2;
            const isBull = (bar.C ?? 0) >= (bar.O ?? 0);
            ctx.fillStyle = isBull ? 'rgba(0, 184, 148, 0.5)' : 'rgba(231, 76, 60, 0.5)';

            let scale = 1;
            if (this._newBarAnim && this._newBarAnim.index === absoluteIndex) {
              scale = this._newBarAnim.progress;
            }

            const fullH = (bar.V || 0) / Math.max(1, rc.volumeMax) * rc.volumeHeight;
            const vHeight = fullH * scale;
            const vy = rc.volumeY + rc.volumeHeight - vHeight;
            ctx.fillRect(x, vy, rc.bodyWidth, Math.max(1, vHeight));
          });
          ctx.restore();
        }

        drawCandles(ctx, rc) {
          ctx.save();
          rc.visibleBars.forEach((bar, localIndex) => {
            const absoluteIndex = rc.visible.start + localIndex;
            const x = rc.xForIndex(absoluteIndex);
            const { open, high, low, close } = this._resolveOHLC(bar);
            const isBull = close >= open;

            let scale = 1;
            if (this._newBarAnim && this._newBarAnim.index === absoluteIndex) {
              scale = this._newBarAnim.progress;
            }

            const mid = (open + close) / 2;
            const oScaled = mid + (open - mid) * scale;
            const cScaled = mid + (close - mid) * scale;
            const hScaled = mid + (high - mid) * scale;
            const lScaled = mid + (low - mid) * scale;

            const top = rc.yForPrice(Math.max(oScaled, cScaled));
            const bottom = rc.yForPrice(Math.min(oScaled, cScaled));

            const candleColor = isBull ? '#00b894' : '#e74c3c';
            ctx.strokeStyle = candleColor;
            ctx.fillStyle = candleColor;
            ctx.lineWidth = 1;

            const yHigh = rc.yForPrice(hScaled);
            const yLow = rc.yForPrice(lScaled);
            const bodyHeight = Math.max(1, bottom - top);
            const bodyX = x - rc.bodyWidth / 2;

            // Upper wick: high → body top (only if wick extends above body)
            if (yHigh < top - 0.5) {
              ctx.beginPath();
              ctx.moveTo(x, yHigh);
              ctx.lineTo(x, top);
              ctx.stroke();
            }

            // Lower wick: body bottom → low (only if wick extends below body)
            if (yLow > bottom + 0.5) {
              ctx.beginPath();
              ctx.moveTo(x, bottom);
              ctx.lineTo(x, yLow);
              ctx.stroke();
            }

            // Body
            if (bodyHeight <= 1.5) {
              ctx.beginPath();
              ctx.moveTo(bodyX, top);
              ctx.lineTo(bodyX + rc.bodyWidth, top);
              ctx.stroke();
            } else {
              if (this.candleFillMode === 'solid') {
                ctx.fillRect(bodyX, top, rc.bodyWidth, bodyHeight);
              } else {
                ctx.strokeRect(bodyX, top, rc.bodyWidth, bodyHeight);
              }
            }
          });
          ctx.restore();
        }

        drawSeriesLine(ctx, rc, field, color) {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          let started = false;
          rc.visibleBars.forEach((bar, localIndex) => {
            const value = bar[field];
            if (value == null) {
              return;
            }
            const absoluteIndex = rc.visible.start + localIndex;
            const x = rc.xForIndex(absoluteIndex);
            const y = rc.yForPrice(value);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          });
          if (started) {
            ctx.stroke();
          }
          ctx.restore();
        }

        drawMALines(ctx, rc) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(rc.area.x, rc.area.y, rc.area.w, rc.priceHeight);
          ctx.clip();
          if (this.maVisibility.m5)   this.drawSeriesLine(ctx, rc, 'm5',   '#eab308');
          if (this.maVisibility.m10)  this.drawSeriesLine(ctx, rc, 'm10',  '#e6a23c');
          if (this.maVisibility.m20)  this.drawSeriesLine(ctx, rc, 'm20',  '#ec4899');
          if (this.maVisibility.m30)  this.drawSeriesLine(ctx, rc, 'm30',  '#14b8a6');
          if (this.maVisibility.m50)  this.drawSeriesLine(ctx, rc, 'm50',  '#409eff');
          if (this.maVisibility.m60)  this.drawSeriesLine(ctx, rc, 'm60',  '#6366f1');
          if (this.maVisibility.m120) this.drawSeriesLine(ctx, rc, 'm120', '#f43f5e');
          if (this.maVisibility.m200) this.drawSeriesLine(ctx, rc, 'm200', '#67c23a');
          if (this.maVisibility.vw)   this.drawSeriesLine(ctx, rc, 'vw',   '#a855f7');
          ctx.restore();
        }

        drawAxes(ctx, rc) {
          const tc = this._themeColors();
          ctx.save();
          ctx.fillStyle = tc.axisText;
          ctx.font = '12px "Segoe UI", "PingFang SC", sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';

          for (let index = 0; index <= 5; index += 1) {
            const price = rc.priceMax - ((rc.priceMax - rc.priceMin) / 5) * index;
            const y = rc.area.y + (rc.priceHeight / 5) * index;
            const pct = ((price - rc.baseline) / Math.max(0.0001, rc.baseline)) * 100;
            ctx.fillStyle = tc.axisText;
            ctx.fillText(price.toFixed(3), rc.chartRight + 10, y);
            ctx.fillStyle = pct >= 0 ? '#00b894' : '#e74c3c';
            ctx.fillText(`${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`, rc.chartRight + 58, y);
          }

          ctx.fillStyle = tc.axisText;
          ctx.textBaseline = 'top';
          const tickStep = Math.max(1, Math.round(rc.visible.count / 6));
          for (let absoluteIndex = rc.visible.start; absoluteIndex <= rc.visible.end; absoluteIndex += tickStep) {
            const bar = rc.bars[absoluteIndex];
            ctx.textAlign = 'center';
            ctx.fillText(bar?.t || '', rc.xForIndex(absoluteIndex), rc.volumeY + rc.volumeHeight + 10);
          }

          ctx.textAlign = 'left';
          ctx.fillStyle = tc.axisTextStrong;
          ctx.fillText('成交量', rc.area.x, rc.volumeY + 4);
          ctx.restore();
        }

        drawHighLowLabels(ctx, rc) {
          if (!rc.visibleBars.length) {
            return;
          }

          let highBar = rc.visibleBars[0];
          let highIndex = rc.visible.start;
          let highValue = this._resolveOHLC(highBar).high ?? -Infinity;
          let lowBar = rc.visibleBars[0];
          let lowIndex = rc.visible.start;
          let lowValue = this._resolveOHLC(lowBar).low ?? Infinity;

          rc.visibleBars.forEach((bar, localIndex) => {
            const absoluteIndex = rc.visible.start + localIndex;
            const { high, low } = this._resolveOHLC(bar);
            if ((high ?? -Infinity) > highValue) {
              highBar = bar;
              highIndex = absoluteIndex;
              highValue = high;
            }
            if ((low ?? Infinity) < lowValue) {
              lowBar = bar;
              lowIndex = absoluteIndex;
              lowValue = low;
            }
          });

          const tc = this._themeColors();
          // Leader-label drawing flips horizontally when the default rightward
          // text would intrude into the right-side Y-axis gutter. This stops
          // the high/low price (e.g. "693.640") from colliding with the axis
          // tick text (e.g. "693.674 +0.15%") near the chart edge.
          const drawLabel = (x, y, text, direction) => {
            ctx.save();
            ctx.strokeStyle = tc.hlLine;
            ctx.fillStyle = tc.hlText;
            ctx.font = '11px "Segoe UI", "PingFang SC", sans-serif';
            ctx.textBaseline = 'middle';
            const lineY = direction === 'up' ? y - 8 : y + 8;
            const textWidth = ctx.measureText(text).width;
            const wantRight = x + 22 + textWidth + 2;
            const flipLeft = wantRight > rc.chartRight - 4;
            const leaderEnd = flipLeft ? x - 18 : x + 18;
            const textX = flipLeft ? x - 22 : x + 22;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(leaderEnd, lineY);
            ctx.stroke();
            ctx.textAlign = flipLeft ? 'right' : 'left';
            ctx.fillText(text, textX, lineY);
            ctx.restore();
          };

          drawLabel(rc.xForIndex(highIndex), rc.yForPrice(highValue), highValue.toFixed(3), 'up');
          drawLabel(rc.xForIndex(lowIndex), rc.yForPrice(lowValue), lowValue.toFixed(3), 'down');
        }

        drawCrosshair(ctx, rc, hoveredIndex) {
          if (!this.hover.inside || hoveredIndex == null) {
            return null;
          }

          const bar = rc.bars[hoveredIndex];
          const x = rc.xForIndex(hoveredIndex);
          const y = clamp(this.hover.y, rc.area.y, rc.volumeY + rc.volumeHeight);
          const price = y <= rc.area.y + rc.priceHeight ? rc.priceForY(y) : (bar?.C ?? rc.baseline);

          const tc = this._themeColors();
          ctx.save();
          ctx.strokeStyle = tc.crosshair;
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);

          ctx.beginPath();
          ctx.moveTo(x, rc.area.y);
          ctx.lineTo(x, rc.volumeY + rc.volumeHeight);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(rc.area.x, y);
          ctx.lineTo(rc.chartRight, y);
          ctx.stroke();
          ctx.setLineDash([]);

          const drawLabel = (labelX, labelY, text) => {
            const paddingX = 8;
            const height = 24;
            ctx.font = '12px "Segoe UI", "PingFang SC", sans-serif';
            const width = ctx.measureText(text).width + paddingX * 2;
            ctx.fillStyle = tc.crosshairLabelBg;
            ctx.fillRect(labelX, labelY - height / 2, width, height);
            ctx.fillStyle = tc.crosshairLabelText;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, labelX + paddingX, labelY);
          };

          drawLabel(rc.chartRight + 8, clamp(y, rc.area.y + 12, rc.volumeY + rc.volumeHeight - 12), price.toFixed(3));
          drawLabel(clamp(x - 68, rc.area.x, rc.chartRight - 136), rc.volumeY + rc.volumeHeight + 16, bar?.t || '-');
          ctx.restore();

          return { bar, price };
        }

        updatePanels(rc, focusBar, crosshairState) {
          const meta = this.dataManager.getMeta();
          const change = focusBar.C != null && focusBar.O != null ? focusBar.C - focusBar.O : 0;
          const changePct = focusBar.O ? (change / focusBar.O) * 100 : 0;
          const volumeText = focusBar.V != null ? focusBar.V.toLocaleString('en-US') : '-';

          this.metaEl.textContent = `${meta.title || 'Untitled'} | ${meta.date || 'n/a'} | tf=${this.currentTimeframe}`;
          const maRow = (key, label, color, first) => {
            const val = focusBar[key]?.toFixed?.(3) ?? '-';
            const cls = this.maVisibility[key] ? '' : 'is-off';
            const ml = first ? ';margin-left:12px' : '';
            return `<span data-ma-tag="${key}" class="${cls}" style="color:${color}${ml}">${label} ${val}</span>`;
          };
          this.hudEl.innerHTML = `
            <strong>O ${focusBar.O?.toFixed?.(3) ?? '-'}</strong>
            <span>H ${focusBar.H?.toFixed?.(3) ?? '-'}</span>
            <span>L ${focusBar.L?.toFixed?.(3) ?? '-'}</span>
            <span>C ${focusBar.C?.toFixed?.(3) ?? '-'}</span>
            <span style="color:${change >= 0 ? '#00b894' : '#e74c3c'}">${change >= 0 ? '+' : ''}${change.toFixed(3)} / ${changePct.toFixed(2)}%</span>
            <span>VOL ${volumeText}</span>
            ${maRow('m5',   'MA5',   '#eab308', true)}
            ${maRow('m10',  'MA10',  '#e6a23c')}
            ${maRow('m20',  'MA20',  '#ec4899')}
            ${maRow('m30',  'MA30',  '#14b8a6')}
            ${maRow('m50',  'MA50',  '#409eff')}
            ${maRow('m60',  'MA60',  '#6366f1')}
            ${maRow('m120', 'MA120', '#f43f5e')}
            ${maRow('m200', 'MA200', '#67c23a')}
            ${maRow('vw',   'VWAP',  '#a855f7')}
          `;
        }

        // ============================================================
        // PlaybackManager — play/pause/step/speed/newBarAnim
        // ============================================================

        play() {
          if (this._playing || this._destroyed) return;
          const bars = this.dataManager.getBars(this.currentTimeframe);
          // Respect reveal cutoff — if already at the teaching boundary, do nothing.
          const cutoff = this._cutoffForCurrent();
          const endIdx = cutoff != null ? Math.min(cutoff, bars.length - 1) : bars.length - 1;
          if (this.currentIndex >= endIdx) return;
          this.viewportManager.setFollowMode(true);
          this._playing = true;
          this._updatePlaybackUI();
          this.emit('playback:state', { playing: true, speed: this._playbackSpeed });
          this._schedulePlaybackTick();
        }

        pause() {
          if (!this._playing) return;
          this._playing = false;
          if (this._playbackTimerId != null) {
            clearTimeout(this._playbackTimerId);
            this._playbackTimerId = null;
          }
          this._updatePlaybackUI();
          this.emit('playback:state', { playing: false, speed: this._playbackSpeed });
        }

        togglePlayback() {
          this._playing ? this.pause() : this.play();
        }

        stepForward() {
          if (this._playing) return;
          const bars = this.dataManager.getBars(this.currentTimeframe);
          const nextIdx = this.currentIndex + 1;
          if (nextIdx >= bars.length) return;
          const cutoff = this._cutoffForCurrent();
          if (cutoff != null && nextIdx > cutoff) return;
          this._advanceTo(nextIdx);
        }

        stepBack() {
          if (this._playing) return;
          if (this.currentIndex <= 0) return;
          this.currentIndex -= 1;
          this.viewportManager.setFollowMode(true);

          this.emit('playback:tick', { index: this.currentIndex });
          this.emit('viewport:changed', this._getViewportPayload());
          this.scheduleRender();
        }

        setSpeed(speed) {
          const validSpeeds = [0.5, 1, 2, 4];
          this._playbackSpeed = validSpeeds.includes(speed) ? speed : 1;
          this._updatePlaybackUI();
          this.emit('playback:state', { playing: this._playing, speed: this._playbackSpeed });
        }

        getSpeed() {
          return this._playbackSpeed;
        }

        isPlaying() {
          return this._playing;
        }

        _schedulePlaybackTick() {
          if (!this._playing || this._destroyed) return;
          const delay = 500 / this._playbackSpeed;
          this._playbackTimerId = setTimeout(() => this._playbackTick(), delay);
        }

        _playbackTick() {
          if (!this._playing || this._destroyed) return;
          const bars = this.dataManager.getBars(this.currentTimeframe);
          const nextIdx = this.currentIndex + 1;
          const cutoff = this._cutoffForCurrent();
          const endIdx = cutoff != null ? Math.min(cutoff, bars.length - 1) : bars.length - 1;
          if (nextIdx > endIdx) {
            this.pause();
            return;
          }
          this._advanceTo(nextIdx);
          this._schedulePlaybackTick();
        }

        _advanceTo(idx) {
          const bars = this.dataManager.getBars(this.currentTimeframe);
          idx = clamp(idx, 0, bars.length - 1);
          this.currentIndex = idx;
          this.viewportManager.setFollowMode(true);
          this._animateNewBar(idx);

          this.emit('playback:tick', { index: idx });
          this.emit('viewport:changed', this._getViewportPayload());
        }

        _animateNewBar(idx) {
          this._newBarAnim = { index: idx, progress: 0 };
          const start = performance.now();
          const duration = 150;

          const step = (now) => {
            if (!this._newBarAnim || this._newBarAnim.index !== idx) return;
            const elapsed = now - start;
            const p = Math.min(elapsed / duration, 1);
            // ease-out-quad
            this._newBarAnim.progress = 1 - Math.pow(1 - p, 2);
            this.scheduleRender();
            if (p < 1) {
              this._newBarAnimHandle = requestAnimationFrame(step);
            } else {
              this._newBarAnim = null;
              this.scheduleRender();
            }
          };
          this._newBarAnimHandle = requestAnimationFrame(step);
        }

        _updatePlaybackUI() {
          const playBtn = this.root.querySelector('[data-action="play"]');
          if (playBtn) {
            playBtn.innerHTML = this._playing ? '&#9208;' : '&#9654;';
            playBtn.title = this._playing ? 'Pause' : 'Play';
          }
          this.root.querySelectorAll('[data-speed]').forEach((btn) => {
            btn.classList.toggle('is-active', parseFloat(btn.dataset.speed) === this._playbackSpeed);
          });
        }

        // ============================================================
        // AnnotationManager — pins, hover, click, scrollTo
        // ============================================================

        static ANNO_COLORS = {
          red:    { fill: '#e74c3c', stroke: '#e74c3c', dim: 'rgba(231,76,60,0.4)' },
          green:  { fill: '#00b894', stroke: '#00b894', dim: 'rgba(0,184,148,0.4)' },
          blue:   { fill: '#409eff', stroke: '#409eff', dim: 'rgba(64,158,255,0.4)' },
          orange: { fill: '#e6a23c', stroke: '#e6a23c', dim: 'rgba(230,162,60,0.4)' },
          purple: { fill: '#a855f7', stroke: '#a855f7', dim: 'rgba(168,85,247,0.4)' },
        };

        _annoColor(style) {
          return KlineEngine.ANNO_COLORS[style] || KlineEngine.ANNO_COLORS.blue;
        }

        _parseScore(score) {
          if (score == null) return null;
          const str = String(score);
          const match = str.match(/^(\d+)\s*\/\s*(\d+)$/);
          if (match) return { num: parseInt(match[1], 10), den: parseInt(match[2], 10) };
          const n = parseFloat(str);
          return Number.isFinite(n) ? { num: n, den: 8 } : null;
        }

        _isHighScore(anno) {
          const parsed = this._parseScore(anno.score);
          return parsed ? parsed.num >= 6 : false;
        }

        drawAnnotationPins(ctx, rc) {
          const annotations = this.dataManager.getAnnotations(this.currentTimeframe);
          if (!annotations.length) return;

          this._annoHitZones = [];
          ctx.save();

          annotations.forEach((anno) => {
            const idx = anno.bar_index;
            if (idx < rc.visible.start || idx > rc.visible.end) return;

            const bar = rc.bars[idx];
            if (!bar) return;

            const x = rc.xForIndex(idx);
            const isTop = anno.anchor_side === 'top';
            const { high, low } = this._resolveOHLC(bar);
            const anchorPrice = isTop ? high : low;
            const anchorY = rc.yForPrice(anchorPrice);

            const colors = this._annoColor(anno.style);
            const isHigh = this._isHighScore(anno);
            // Beefier defaults so non-high-score pins remain visible against
            // candles + MA lines; halo ring keeps them legible on busy charts.
            const pinSize = isHigh ? 9 : 7;
            const stemLen = isHigh ? 18 : 14;
            const alpha = isHigh ? 1.0 : 0.9;
            const haloColor = this.theme === 'light' ? 'rgba(255,255,255,0.95)' : 'rgba(20,20,18,0.95)';

            // Stem line
            const stemDir = isTop ? -1 : 1;
            const stemStart = anchorY + stemDir * 4;
            const stemEnd = stemStart + stemDir * stemLen;

            ctx.globalAlpha = alpha;
            // Halo behind stem so it doesn't disappear into MA lines.
            ctx.strokeStyle = haloColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, stemStart);
            ctx.lineTo(x, stemEnd);
            ctx.stroke();
            ctx.strokeStyle = colors.stroke;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x, stemStart);
            ctx.lineTo(x, stemEnd);
            ctx.stroke();

            // Triangle pin with halo outline
            const triTip = stemEnd;
            const triBase = triTip + stemDir * pinSize;
            ctx.beginPath();
            ctx.moveTo(x, triTip);
            ctx.lineTo(x - pinSize * 0.78, triBase);
            ctx.lineTo(x + pinSize * 0.78, triBase);
            ctx.closePath();
            ctx.lineJoin = 'round';
            ctx.strokeStyle = haloColor;
            ctx.lineWidth = 2.2;
            ctx.stroke();
            ctx.fillStyle = colors.fill;
            ctx.fill();

            ctx.globalAlpha = 1;

            // Hit zone for hover/click
            const hitY = Math.min(stemStart, stemEnd, triBase) - 4;
            const hitH = Math.abs(triBase - stemStart) + 8;
            const hitW = pinSize * 2 + 6;
            this._annoHitZones.push({
              x: x - hitW / 2,
              y: hitY,
              w: hitW,
              h: hitH,
              anno,
              screenX: x,
              screenY: Math.min(stemStart, stemEnd),
            });
          });

          // Highlight flash for scrollTo
          if (this._scrollToHighlight) {
            const hl = this._scrollToHighlight;
            if (performance.now() < hl.until) {
              const idx = hl.index;
              if (idx >= rc.visible.start && idx <= rc.visible.end) {
                const x = rc.xForIndex(idx);
                const bar = rc.bars[idx];
                if (bar) {
                  const { high, low } = this._resolveOHLC(bar);
                  const yTop = rc.yForPrice(high);
                  const yBot = rc.yForPrice(low);
                  const elapsed = performance.now() - (hl.until - 1200);
                  const pulse = 0.25 + 0.2 * Math.sin(elapsed / 120 * Math.PI);
                  ctx.fillStyle = `rgba(64, 158, 255, ${pulse})`;
                  ctx.fillRect(x - rc.bodyWidth, yTop - 4, rc.bodyWidth * 2, yBot - yTop + 8);
                }
              }
              this.scheduleRender();
            } else {
              this._scrollToHighlight = null;
            }
          }

          ctx.restore();
        }

        _hitTestAnnotation(mx, my) {
          for (let i = this._annoHitZones.length - 1; i >= 0; i--) {
            const zone = this._annoHitZones[i];
            if (mx >= zone.x && mx <= zone.x + zone.w && my >= zone.y && my <= zone.y + zone.h) {
              return zone;
            }
          }
          return null;
        }

        _showAnnoTooltip(zone) {
          const titleEl = this.annoTooltip.querySelector('[data-role="anno-title"]');
          const bodyEl = this.annoTooltip.querySelector('[data-role="anno-body"]');
          const scoreEl = this.annoTooltip.querySelector('[data-role="anno-score"]');

          titleEl.textContent = zone.anno.title;
          bodyEl.textContent = zone.anno.body || '';
          bodyEl.style.display = zone.anno.body ? '' : 'none';

          if (zone.anno.score != null) {
            scoreEl.textContent = String(zone.anno.score);
            scoreEl.style.display = '';
            const colors = this._annoColor(zone.anno.style);
            scoreEl.style.background = colors.dim;
            scoreEl.style.color = colors.fill;
          } else {
            scoreEl.style.display = 'none';
          }

          // Position tooltip relative to viewport
          const viewRect = this.viewportEl.getBoundingClientRect();
          const canvasRect = this.canvas.getBoundingClientRect();
          const offsetX = canvasRect.left - viewRect.left;
          const offsetY = canvasRect.top - viewRect.top;

          let left = offsetX + zone.screenX + 12;
          let top = offsetY + zone.screenY - 10;

          // Keep within viewport bounds
          this.annoTooltip.classList.add('is-visible');
          const tooltipRect = this.annoTooltip.getBoundingClientRect();
          if (left + tooltipRect.width > viewRect.width - 8) {
            left = offsetX + zone.screenX - tooltipRect.width - 12;
          }
          if (top + tooltipRect.height > viewRect.height - 8) {
            top = viewRect.height - tooltipRect.height - 8;
          }
          if (top < 4) top = 4;

          this.annoTooltip.style.left = `${left}px`;
          this.annoTooltip.style.top = `${top}px`;
        }

        _hideAnnoTooltip() {
          this.annoTooltip.classList.remove('is-visible');
          this._hoveredAnno = null;
        }

        _updateAnnoHover() {
          if (!this.hover.inside) {
            if (this._hoveredAnno) this._hideAnnoTooltip();
            return;
          }
          const hit = this._hitTestAnnotation(this.hover.x, this.hover.y);
          if (hit) {
            if (this._hoveredAnno !== hit.anno) {
              this._hoveredAnno = hit.anno;
              this._showAnnoTooltip(hit);
            }
          } else if (this._hoveredAnno) {
            this._hideAnnoTooltip();
          }
        }

        _updateHoverCard() {
          if (!this.hoverCard) return;
          // Annotation tooltip wins; we never stack the two.
          if (!this.hover.inside || this._hoveredAnno || !this.lastRenderContext) {
            this._hideHoverCard();
            return;
          }
          const rc = this.lastRenderContext;
          // Plan #8: strict hit-test on the chart drawing area only. Reject when
          // cursor is in toolbar / right axis / bottom time axis / outer padding.
          // Crosshair stays mouse-tracked elsewhere; only the card hides.
          const inChart = (
            this.hover.x >= rc.area.x && this.hover.x <= rc.chartRight &&
            this.hover.y >= rc.area.y && this.hover.y <= rc.volumeY + rc.volumeHeight
          );
          if (!inChart) {
            this._hideHoverCard();
            return;
          }
          let idx = rc.barIndexForX(this.hover.x);
          // Respect reveal cutoff so the hover card doesn't leak future bars.
          const cutoff = this._cutoffForCurrent();
          if (cutoff != null && idx > cutoff) idx = cutoff;
          const bar = rc.bars[idx];
          if (!bar) { this._hideHoverCard(); return; }
          this._showHoverCard(bar, this.hover.x);
        }

        _showHoverCard(bar, hoverX) {
          if (!this.hoverCard) return;
          const meta = this.dataManager.getMeta();
          const open = bar.O ?? 0;
          const high = bar.H ?? 0;
          const low = bar.L ?? 0;
          const close = bar.C ?? 0;
          const change = (open != null && close != null) ? close - open : 0;
          const changePct = open ? (change / open) * 100 : 0;
          const upClass = change >= 0 ? 'is-up' : 'is-down';
          const sign = change >= 0 ? '+' : '';
          const volText = bar.V != null ? bar.V.toLocaleString('en-US') : '-';

          const timeEl = this.hoverCard.querySelector('[data-role="hc-time"]');
          const rowsEl = this.hoverCard.querySelector('[data-role="hc-rows"]');
          if (timeEl) timeEl.textContent = `${meta?.date || ''} ${bar.t || ''}`.trim() || '—';
          if (rowsEl) {
            rowsEl.innerHTML = `
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">开盘</span><span class="kline-engine__hover-card-value">${open.toFixed(3)}</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">最高</span><span class="kline-engine__hover-card-value">${high.toFixed(3)}</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">最低</span><span class="kline-engine__hover-card-value">${low.toFixed(3)}</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">收盘</span><span class="kline-engine__hover-card-value">${close.toFixed(3)}</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">涨跌额</span><span class="kline-engine__hover-card-value ${upClass}">${sign}${change.toFixed(3)}</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">涨跌幅</span><span class="kline-engine__hover-card-value ${upClass}">${sign}${changePct.toFixed(2)}%</span></div>
              <div class="kline-engine__hover-card-row"><span class="kline-engine__hover-card-label">成交量</span><span class="kline-engine__hover-card-value">${volText}</span></div>
            `;
          }

          // Plan #8: anchor to the chart top safe-zone, NOT to the cursor.
          // Cursor on left half → card sits at chart's upper-RIGHT corner.
          // Cursor on right half → card sits at chart's upper-LEFT corner.
          // Top is fixed at chart-area.y + 8 (above all candles, well clear of
          // the right price axis text and the bottom time axis text).
          const rc = this.lastRenderContext;
          if (!rc) return;
          const viewRect = this.viewportEl.getBoundingClientRect();
          const canvasRect = this.canvas.getBoundingClientRect();
          const offsetX = canvasRect.left - viewRect.left;
          const offsetY = canvasRect.top - viewRect.top;

          this.hoverCard.classList.add('is-visible');
          const cardRect = this.hoverCard.getBoundingClientRect();
          const chartCenterX = (rc.area.x + rc.chartRight) / 2;
          const onLeftSide = hoverX < chartCenterX;
          const safeY = offsetY + rc.area.y + 8;
          let left = onLeftSide
            ? offsetX + rc.chartRight - cardRect.width - 8
            : offsetX + rc.area.x + 8;
          // Defensive viewport clamp (cards larger than half-chart fall back here).
          if (left < 4) left = 4;
          if (left + cardRect.width > viewRect.width - 4) left = viewRect.width - cardRect.width - 4;
          let top = safeY;
          if (top < 4) top = 4;
          if (top + cardRect.height > viewRect.height - 4) top = viewRect.height - cardRect.height - 4;
          this.hoverCard.style.left = `${left}px`;
          this.hoverCard.style.top = `${top}px`;
        }

        _hideHoverCard() {
          if (!this.hoverCard) return;
          this.hoverCard.classList.remove('is-visible');
        }

        scrollTo(target) {
          // Normalize arguments: scrollTo(142) or scrollTo({barIndex, timeframe, ...})
          let barIndex, timeframe, highlight, center;
          if (typeof target === 'number') {
            barIndex = target;
            timeframe = this.currentTimeframe;
            highlight = false;
            center = true;
          } else {
            barIndex = target.barIndex ?? 0;
            timeframe = target.timeframe || this.currentTimeframe;
            highlight = target.highlight ?? false;
            center = target.center ?? true;
          }

          this.pause();

          // Switch timeframe if needed
          if (timeframe !== this.currentTimeframe && this.dataManager.hasTimeframe(timeframe)) {
            this.currentTimeframe = timeframe;
            this.dataManager.timeframe = timeframe;
            this._updateToolbarState();
          }

          const bars = this.dataManager.getBars(this.currentTimeframe);
          if (!bars.length) return;

          barIndex = clamp(barIndex, 0, bars.length - 1);

          this.currentIndex = barIndex;

          if (center) {
            // Position barIndex in the center of the visible window.
            // followMode=false allows viewport to show any part of the data.
            const chartWidth = this._getChartWidth();
            const viewInfo = this.viewportManager.getResolvedViewCount(bars.length, this.currentTimeframe, chartWidth);
            const halfView = Math.floor(viewInfo.count / 2);
            this.viewportManager.viewStart = clamp(barIndex - halfView, 0, Math.max(0, bars.length - viewInfo.count));
            this.viewportManager.setFollowMode(false);
          } else {
            this.viewportManager.setFollowMode(true);
          }

          if (highlight) {
            this._scrollToHighlight = { index: barIndex, until: performance.now() + 1200 };
          }


          this.emit('viewport:changed', this._getViewportPayload());
          this.scheduleRender();
        }

        setCurrentIndex(nextIndex, { follow = true } = {}) {
          const bars = this.dataManager.getBars(this.currentTimeframe);
          if (!bars.length) {
            return this.currentIndex;
          }
          const cutoff = this._cutoffForCurrent();
          const upper = cutoff != null ? Math.min(cutoff, bars.length - 1) : bars.length - 1;
          this.currentIndex = clamp(nextIndex, 0, upper);
          if (follow) {
            this.viewportManager.setFollowMode(true);
          }

          this.emit('viewport:changed', this._getViewportPayload());
          this.scheduleRender();
          return this.currentIndex;
        }

        loadData(json) {
          this.pause();
          // Reset per-dataset teaching state BEFORE dataManager.loadData runs:
          // the 'data:loaded' event emits inside that call, and listeners (e.g.
          // the teaching adapter) may set cutoff/highlight during the event.
          // If we cleared after, those values would be wiped.
          this.revealCutoff = { '1m': null, '5m': null };
          this.highlightRanges = [];
          const summary = this.dataManager.loadData(json);
          this.currentTimeframe = this.dataManager.getTimeframe();
          this.currentIndex = this._resolveInitialIndex(this.currentTimeframe);
          this.viewportManager.reset();
          this._updateToolbarState();
          this._updatePlaybackUI();

          this.scheduleRender();
          return summary;
        }

        // ============================================================
        // Reveal cutoff — limit the visible/playable range to [0..cutoff]
        // on a per-timeframe basis. Teaching integrations use this to hide
        // future bars during step-by-step training.
        // ============================================================

        /**
         * Set or clear the reveal cutoff.
         *
         * Usage:
         *   setRevealCutoff(null)                 // clear all cutoffs
         *   setRevealCutoff(42)                   // set cutoff for CURRENT timeframe to bar index 42
         *   setRevealCutoff({ timeframe: '1m', barIndex: 31 })  // set for a specific timeframe
         *   setRevealCutoff({ timeframe: '5m', barIndex: null }) // clear one timeframe
         *
         * When set, bars with index > cutoff are not rendered (candles, volume,
         * MA, annotations), Y-axis min/max is computed from visible-and-allowed
         * bars only, currentIndex is clamped, and play()/stepForward() stop at
         * the cutoff.
         *
         * Emits 'revealcutoff:changed' with a snapshot of both timeframes.
         */
        setRevealCutoff(input) {
          const normalize = (val) => {
            if (val == null) return null;
            const n = Math.floor(Number(val));
            return Number.isFinite(n) && n >= 0 ? n : null;
          };

          if (input == null) {
            this.revealCutoff = { '1m': null, '5m': null };
          } else if (typeof input === 'number') {
            this.revealCutoff[this.currentTimeframe] = normalize(input);
          } else if (input && typeof input === 'object') {
            const tf = input.timeframe || this.currentTimeframe;
            if (tf !== '1m' && tf !== '5m') return this.revealCutoff;
            this.revealCutoff[tf] = normalize(input.barIndex);
          }

          // If the active timeframe's cutoff shrinks below currentIndex, clamp it.
          const activeCutoff = this.revealCutoff[this.currentTimeframe];
          if (activeCutoff != null && this.currentIndex > activeCutoff) {
            this.currentIndex = activeCutoff;
          }
          if (this._playing) this.pause();

          this.emit('revealcutoff:changed', { ...this.revealCutoff });
          this.scheduleRender();
          return { ...this.revealCutoff };
        }

        /** Get the cutoff for a timeframe (defaults to current). null = unbounded. */
        getRevealCutoff(timeframe) {
          const tf = timeframe || this.currentTimeframe;
          return this.revealCutoff[tf] ?? null;
        }

        _cutoffForCurrent() {
          return this.revealCutoff[this.currentTimeframe];
        }

        // ============================================================
        // Highlight ranges — translucent bands drawn behind candles to
        // visually link an external UI row (e.g. validation panel) to a
        // span of bars on the chart. Teaching integrations only.
        // ============================================================

        /**
         * Replace the set of highlight ranges.
         *
         * Usage:
         *   setHighlightRanges(null)                              // clear all
         *   setHighlightRanges([])                                // clear all
         *   setHighlightRanges({ timeframe, startIndex, endIndex, style? })
         *   setHighlightRanges([{ timeframe, startIndex, endIndex, style? }, ...])
         *
         * style: 'olive' (default, pass), 'red' (fail), 'blue' (info).
         * Ranges whose `timeframe` doesn't match the current one are stored but
         * not drawn until the engine switches to that tf.
         *
         * Emits 'highlight:changed' with a shallow copy of the stored array.
         */
        setHighlightRanges(input) {
          const normalize = (raw) => {
            if (!raw || typeof raw !== 'object') return null;
            const tf = raw.timeframe === '5m' ? '5m' : '1m';
            const start = Math.floor(Number(raw.startIndex));
            const end = Math.floor(Number(raw.endIndex));
            if (!Number.isFinite(start) || !Number.isFinite(end) || start < 0 || end < 0) return null;
            const lo = Math.min(start, end);
            const hi = Math.max(start, end);
            const style = ['red', 'blue', 'marker'].includes(raw.style) ? raw.style : 'olive';
            return { timeframe: tf, startIndex: lo, endIndex: hi, style };
          };

          let next;
          if (input == null) {
            next = [];
          } else if (Array.isArray(input)) {
            next = input.map(normalize).filter(Boolean);
          } else {
            const n = normalize(input);
            next = n ? [n] : [];
          }

          this.highlightRanges = next;
          this.emit('highlight:changed', this.highlightRanges.slice());
          this.scheduleRender();
          return this.highlightRanges.slice();
        }

        /** Read the current highlight ranges (shallow copy). */
        getHighlightRanges() {
          return this.highlightRanges.slice();
        }
